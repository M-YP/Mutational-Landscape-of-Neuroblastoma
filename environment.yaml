name: neuroblastoma-wgs-env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python environment & core utilities
  - python=3.10
  - sra-tools=3.0.10
  - curl
  - wget

  # Quality Control & Trimming
  - fastqc=0.12.1
  - trimmomatic=0.39

  # Alignment & BAM Processing
  - bwa-mem2=2.2.1
  - samtools=1.22
  - picard=3.1.1

  # Variant Calling & Manipulation
  # fastqc, trimmomatic, bwa-mem2, picard and freebayes have the same
  # versions as in Neuroblastoma_WGS_Pipeline.json.
  # vcflib is not the same. The workflow uses vcflib 1.0.0_rc3, but
  # freebayes 1.3.10 needs vcflib 1.0.14 or later, and vcflib 1.0.0_rc3
  # has only a Python 3.7 build. Thus, local vcffilter and vcfintersect
  # results can be different from the Galaxy results.
  # DeepVariant is not in this environment, because Bioconda has
  # DeepVariant 1.5.0 only for Python 3.6. Galaxy runs it from the
  # Docker image google/deepvariant:1.5.0. Use the same image locally.
  - freebayes=1.3.10
  - vcflib=1.0.14
  - bcftools=1.22

  # Downstream & Reporting Tools
  - multiqc=1.19
