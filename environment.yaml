name: neuroblastoma-wgs-env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python environment & core utilities
  - python=3.10
  - sra-tools=3.0.10
  - curl
  - wget

  # Quality Control & Trimming
  - fastqc=0.12.1
  - trimmomatic=0.39

  # Alignment & BAM Processing
  - bwa-mem2=2.2.1
  - samtools=1.19
  - picard=3.1.1

  # Variant Calling & Manipulation
  - freebayes=1.3.6
  - vcflib=1.0.3
  - bcftools=1.19

  # Downstream & Reporting Tools
  - multiqc=1.19
