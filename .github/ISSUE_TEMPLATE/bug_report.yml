name: Bug report
description: Report a problem in the pipeline or repository
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide as much detail as possible so we can reproduce and fix it quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the issue.
      placeholder: Example: Variant calling fails on paired-end FASTQ input.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps to reproduce the problem.
      placeholder: |
        1. Run `...`
        2. Provide sample configuration
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the error message or output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, software versions, and toolchain details.
      placeholder: |
        - OS:
        - Shell:
        - Python/R version:
        - Reference genome:
        - Data type: FASTQ/BAM/VCF
        - Command used:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / tracebacks
      description: Paste relevant output, stack traces, or command logs.
      render: shell
  - type: textarea
    id: extras
    attributes:
      label: Additional context
      description: Add screenshots, sample names, or any other context that may help diagnose the issue.
